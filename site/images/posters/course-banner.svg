<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="courseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a130e"/>
      <stop offset="100%" style="stop-color:#7a1f17"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a038"/>
      <stop offset="50%" style="stop-color:#e8d4b8"/>
      <stop offset="100%" style="stop-color:#c8a038"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#courseBg)"/>
  <rect x="40" y="40" width="720" height="320" fill="none" stroke="url(#goldLine)" stroke-width="2" rx="12"/>
  <rect x="50" y="50" width="700" height="300" fill="none" stroke="rgba(200,160,56,0.2)" stroke-width="0.5" rx="8"/>

  <!-- Decorative cross elements -->
  <g fill="none" stroke="rgba(200,160,56,0.3)" stroke-width="1.5">
    <circle cx="120" cy="120" r="30"/>
    <path d="M120 90v60M90 120h60"/>
    <circle cx="120" cy="120" r="6" fill="rgba(200,160,56,0.5)"/>

    <circle cx="680" cy="280" r="30"/>
    <path d="M680 250v60M650 280h60"/>
    <circle cx="680" cy="280" r="6" fill="rgba(200,160,56,0.5)"/>
  </g>

  <!-- Coptic cross motif top right -->
  <g transform="translate(600, 80)" fill="none" stroke="rgba(200,160,56,0.25)" stroke-width="2">
    <path d="M0 0v40M-20 20h40"/>
    <circle cx="0" cy="0" r="8"/>
    <circle cx="0" cy="20" r="4" fill="rgba(200,160,56,0.3)"/>
  </g>
</svg>